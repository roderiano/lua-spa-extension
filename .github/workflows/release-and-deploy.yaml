name: Release & Deploy Extension

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python (for Black requirement in extension activation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Black
        run: |
          python -m pip install --upgrade pip
          python -m pip install black

      - name: Install dependencies
        run: npm ci
        
      - name: Read extension version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved_version=v$VERSION"

      - name: Validate extension manifest for publishing
        run: |
          PUBLISHER=$(node -p "require('./package.json').publisher || ''")
          if [ -z "$PUBLISHER" ]; then
            echo "package.json is missing the 'publisher' field required by VSCE publish."
            exit 1
          fi

      - name: Ensure version changed in package.json
        if: github.event_name == 'push'
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if git diff HEAD~1 HEAD -- package.json | grep -q '"version"'; then
              echo "Version updated."
            else
              echo "Version not changed in this commit. Skipping release."
              exit 0
            fi
          else
            echo "No previous commit available to compare. Continuing."
          fi

      - name: Check if tag already exists
        id: check_tag
        run: |
          git fetch --tags
          TAG=${{ steps.get_version.outputs.version }}
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG=${{ steps.get_version.outputs.version }}
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish extension to Visual Studio Marketplace
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Missing VSCE_PAT secret."
            exit 1
          fi
          npx @vscode/vsce publish -p "$VSCE_PAT"

