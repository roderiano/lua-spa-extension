name: CI

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python (for Black requirement in extension activation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Black
        run: |
          python -m pip install --upgrade pip
          python -m pip install black

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Setup Xvfb (for GUI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &

      - name: Test
        env:
          DISPLAY: :99
        run: npm test
